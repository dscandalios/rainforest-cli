project_id = "spider-cards"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "spidercards://"
additional_redirect_urls = ["spidercards://auth-callback"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true

[functions.scan-spider]
verify_jwt = true

[functions.enrich-species]
verify_jwt = true

[functions.recalibrate-curve]
verify_jwt = false   # invoked by cron with a shared secret in header

[storage]
enabled = true
file_size_limit = "20MiB"
